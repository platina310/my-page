<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- index.html 의 body 안에 작성 -->
<header>
  <h1>이수정을 소개합니다</h1>
  <button id="theme-btn">다크모드 전환</button>
</header>

<!-- main에 cards 이름표를 붙인다. 다음 단계의 CSS가 이 이름으로 카드들을 가로 배치한다.
     제목을 header로 빼는 이유는 main이 '카드들을 담는 컨테이너' 역할을 맡기 때문이다 -->
<main class="cards">

  <!-- article: 독립적으로 의미있는 '카드 하나' -->
  <article class="card">
    <img src="https://placehold.co/120x120" alt="김하나 프로필 사진">
    <h2>이수정</h2>
    <p class="role">디지털금융 MBA</p>
    <p>자산운용사에서 국내 주식운용 리서치를 맡고 있습니다.</p>
    <a href="https://github.com">GitHub 프로필</a>
  </article>
    <article class="card">
    <h2>관심 분야</h2>
    <p class="role">무엇을 파고드나</p>
    <p>건강하고 착한 부자가 되기 위해 노력하고 있습니다.</p>
  </article>

  <section>
     <h2>프론트엔드·백엔드 연동 실습</h2>
     <p>React 화면에서 FastAPI 백엔드 API를 호출하는 메모 앱입니다.</p>
     <p><a href="https://memo-frontend-dfmba.vercel.app" target="_blank">📝 메모 앱 열기</a></p>
     <p><a href="https://memo-backend-3iqc.onrender.com/docs" target="_blank">📘 백엔드 Swagger UI</a></p>
  </section>

</main>
<script src="script.js"></script>
</body>
</html>
